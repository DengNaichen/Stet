name: macOS CI

on:
  pull_request:
    paths:
      - ".github/workflows/macos-ci.yml"
      - ".swift-format"
      - ".swiftlint.yml"
      - "package.json"
      - "Info.plist"
      - ".kiro/**"
      - "Stet.xcodeproj/**"
      - "Stet/**"
      - "StetTests/**"
      - "StetUITests/**"
      - "StetVisuals/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/macos-ci.yml"
      - ".swift-format"
      - ".swiftlint.yml"
      - "package.json"
      - "Info.plist"
      - ".kiro/**"
      - "Stet.xcodeproj/**"
      - "Stet/**"
      - "StetTests/**"
      - "StetUITests/**"
      - "StetVisuals/**"

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: npm run mac:lint

  swift-format:
    name: Swift Format
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run Swift Format Lint
        run: npm run mac:format:lint

  macos-build:
    name: macOS Build
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build macOS app
        run: npm run mac:ci:build

  macos-tests:
    name: macOS Tests
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Run macOS tests
        run: npm run mac:test
