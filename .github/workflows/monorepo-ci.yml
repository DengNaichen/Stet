name: Monorepo CI

on:
  pull_request:
  push:
    branches:
      - main
      - "migration/**"

permissions:
  contents: read

# New commits supersede older PR runs; main and migration pushes still finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Repository Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      quality: ${{ steps.scope.outputs.quality }}
      macos: ${{ steps.scope.outputs.macos }}

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history makes PR merge-base and multi-commit push diffs exact.
          fetch-depth: 0

      - name: Determine affected jobs
        id: scope
        run: python3 scripts/ci-changes.py

      - name: Validate app compatibility list
        env:
          BASE_REF: ${{ steps.scope.outputs.base_ref }}
        run: |
          args=()
          if [[ -n "$BASE_REF" ]]; then args+=(--base-ref "$BASE_REF"); fi
          python3 scripts/validate-app-compatibility.py "${args[@]}"

      - name: Test CI helpers
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Validate harness entrypoints
        run: scripts/validate-agent-entrypoints

      - name: Validate workflow syntax
        if: steps.scope.outputs.workflows == 'true'
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  quality:
    name: Swift Quality
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run lint checks
        run: make lint

  macos:
    # `make test` builds the Stet app and its dependencies before running tests.
    # A separate Debug build would repeat the same compilation and cache I/O.
    name: macOS Tests
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CI_XCODEBUILD_FLAGS: >-
        -derivedDataPath .build/ci
        -onlyUsePackageVersionsFromResolvedFile
        -skipPackageUpdates
        -showBuildTimingSummary
        COMPILATION_CACHE_ENABLE_CACHING=YES
        COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES

    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Identify toolchain
        id: toolchain
        run: |
          fingerprint=$( { xcodebuild -version; xcrun --sdk macosx --show-sdk-build-version; sw_vers -buildVersion; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore Swift packages
        id: packages
        uses: actions/cache/restore@v5
        with:
          path: .build/ci/SourcePackages
          key: spm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Packages/**/Package.swift', 'Packages/**/Package.resolved', 'Stet.xcodeproj/**/Package.resolved') }}
          restore-keys: |
            spm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-

      - name: Cache Swift package manifests
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm/manifests
          key: spm-manifests-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Packages/**/Package.swift', 'Packages/**/Package.resolved', 'Stet.xcodeproj/**/Package.resolved') }}

      # On a hit, the build command validates/resolves the restored packages.
      # A separate resolve is only needed to save downloads before a cold build.
      - name: Resolve Swift packages
        if: steps.packages.outputs.cache-hit != 'true'
        run: >-
          xcodebuild -resolvePackageDependencies
          -project Stet.xcodeproj -scheme Stet
          -derivedDataPath .build/ci
          -onlyUsePackageVersionsFromResolvedFile -skipPackageUpdates

      - name: Save Swift packages
        if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .build/ci/SourcePackages
          key: ${{ steps.packages.outputs.cache-primary-key }}

      - name: Restore compilation cache
        id: compilation
        uses: actions/cache/restore@v5
        with:
          path: .build/ci/CompilationCache.noindex
          key: compilation-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-test-${{ github.sha }}
          restore-keys: |
            compilation-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-test-

      - name: Restore incremental build
        id: incremental
        uses: actions/cache/restore@v5
        with:
          path: |
            .build/ci/Build
            .build/ci/ModuleCache.noindex
            .build/ci/source-mtimes.json
          key: incremental-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-test-${{ github.sha }}
          restore-keys: |
            incremental-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-test-

      - name: Validate incremental build inputs
        run: python3 scripts/ci-source-mtimes.py restore .build/ci/source-mtimes.json

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build and test macOS app
        run: make test

      # Compiler results are reusable even if a later test fails. Never cache
      # test results or skip test execution on a cache hit.
      - name: Save compilation cache
        if: ${{ !cancelled() && steps.compilation.outcome == 'success' && steps.compilation.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .build/ci/CompilationCache.noindex
          key: ${{ steps.compilation.outputs.cache-primary-key }}

      - name: Record incremental build inputs
        if: success() && steps.incremental.outputs.cache-hit != 'true'
        run: python3 scripts/ci-source-mtimes.py save .build/ci/source-mtimes.json

      - name: Save incremental build
        if: success() && steps.incremental.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .build/ci/Build
            .build/ci/ModuleCache.noindex
            .build/ci/source-mtimes.json
          key: ${{ steps.incremental.outputs.cache-primary-key }}

  result:
    name: CI Result
    needs: [changes, quality, macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          needs = json.loads(os.environ["NEEDS_JSON"])
          assert needs["changes"]["result"] == "success", "Repository checks failed or were cancelled"
          for name in ("quality", "macos"):
              selected = needs["changes"]["outputs"][name]
              assert selected in ("true", "false"), f"Missing CI selection: {name}"
              expected = "success" if selected == "true" else "skipped"
              actual = needs[name]["result"]
              assert actual == expected, f"{name}: expected {expected}, got {actual}"
          print("All selected checks passed.")
          PY
