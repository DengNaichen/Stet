name: macOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or commit SHA to build
        required: false
        default: main
        type: string
      release_tag:
        description: Release tag to publish, for example v0.0.10-rc1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build And Publish macOS Release
    runs-on: macos-26
    environment: production
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
      ARCHIVE_CODE_SIGN_STYLE: Manual
      ARCHIVE_PROVISIONING_PROFILE_SPECIFIER: ${{ vars.ARCHIVE_PROVISIONING_PROFILE_SPECIFIER }}
      DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
      DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
      DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
      GENERATE_SPARKLE_APPCAST: "1"
      GITHUB_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      NOTARY_PROFILE: stet-notary
      SPARKLE_APPCAST_URL: ${{ vars.SPARKLE_APPCAST_URL }}
      SPARKLE_FEED_BASE_URL: ${{ vars.SPARKLE_FEED_BASE_URL }}
      SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_KEY_BASE64 }}
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.ref }}
          fetch-depth: 0

      - name: Set Up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Show Tool Versions
        run: |
          xcodebuild -version
          node --version
          npm --version
          gh --version

      - name: Import Developer ID Certificate
        run: |
          CERT_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          LOGIN_KEYCHAIN="$(security login-keychain -d user | tr -d '"')"

          if [[ -z "$DEVELOPER_ID_APPLICATION_P12_BASE64" ]]; then
            echo "Missing DEVELOPER_ID_APPLICATION_P12_BASE64 secret."
            exit 1
          fi

          if [[ -z "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" ]]; then
            echo "Missing DEVELOPER_ID_APPLICATION_P12_PASSWORD secret."
            exit 1
          fi

          echo "$DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 -D > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild \
            -T /usr/bin/productsign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$LOGIN_KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          {
            echo "RUNNER_KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "RUNNER_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Store Notarytool Credentials
        run: ./scripts/setup-notarytool-profile.sh

      - name: Resolve Release Metadata
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
            RELEASE_DRAFT=true
            RELEASE_PRERELEASE=true
            RELEASE_LATEST=false
            RELEASE_VERIFY_TAG=false
            RELEASE_TARGET="${{ inputs.git_ref }}"
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
            RELEASE_DRAFT=false
            RELEASE_VERIFY_TAG=true

            if [[ "$RELEASE_TAG" == *-* ]]; then
              RELEASE_PRERELEASE=true
              RELEASE_LATEST=false
            else
              RELEASE_PRERELEASE=false
              RELEASE_LATEST=true
            fi
          fi

          {
            echo "GITHUB_TAG=$RELEASE_TAG"
            echo "GITHUB_RELEASE_DRAFT=$RELEASE_DRAFT"
            echo "GITHUB_RELEASE_PRERELEASE=$RELEASE_PRERELEASE"
            echo "GITHUB_RELEASE_LATEST=$RELEASE_LATEST"
            echo "GITHUB_RELEASE_VERIFY_TAG=$RELEASE_VERIFY_TAG"
            if [[ -n "${RELEASE_TARGET:-}" ]]; then
              echo "GITHUB_RELEASE_TARGET=$RELEASE_TARGET"
            fi
          } >> "$GITHUB_ENV"

      - name: Materialize Sparkle Private Key
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY_BASE64" ]]; then
            echo "Missing SPARKLE_PRIVATE_KEY_BASE64 secret."
            exit 1
          fi

          SPARKLE_PRIVATE_KEY_PATH="$RUNNER_TEMP/sparkle-private-key"
          echo "$SPARKLE_PRIVATE_KEY_BASE64" | base64 -D > "$SPARKLE_PRIVATE_KEY_PATH"
          chmod 600 "$SPARKLE_PRIVATE_KEY_PATH"
          echo "SPARKLE_PRIVATE_KEY_PATH=$SPARKLE_PRIVATE_KEY_PATH" >> "$GITHUB_ENV"

      - name: Resolve Sparkle Tooling
        run: |
          shopt -s nullglob

          candidates=(
            "$GITHUB_WORKSPACE/.build/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast"
            "$GITHUB_WORKSPACE/.build/SourcePackages/checkouts/Sparkle/bin/generate_appcast"
            "$GITHUB_WORKSPACE/build/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast"
            "$GITHUB_WORKSPACE/build/SourcePackages/checkouts/Sparkle/bin/generate_appcast"
            "$HOME"/Library/Developer/Xcode/DerivedData/*/SourcePackages/checkouts/Sparkle/bin/generate_appcast
            "$HOME"/Library/Developer/Xcode/DerivedData/*/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast
          )

          for candidate in "${candidates[@]}"; do
            if [[ -x "$candidate" ]]; then
              echo "SPARKLE_GENERATE_APPCAST=$candidate" >> "$GITHUB_ENV"
              echo "Using generate_appcast at $candidate"
              exit 0
            fi
          done

          echo "Unable to find Sparkle generate_appcast tool in standard artifact locations."
          exit 1

      - name: Build Release
        run: ./scripts/release-macos-github.sh

      - name: Publish GitHub Release
        run: ./scripts/publish-github-release.sh

      - name: Upload Release Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          path: |
            dist/github-release/${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          if-no-files-found: warn
          retention-days: 30

      - name: Clean Up Temporary Keychain
        if: always()
        run: |
          if [[ -n "${RUNNER_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$RUNNER_KEYCHAIN_PATH" || true
          fi
