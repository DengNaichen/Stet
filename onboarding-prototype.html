              class="notepad-textarea"
              id="firstSuccessInput"
              placeholder="Your spoken words will appear here…"
            >${state.dictatedText}</textarea>
          </div>

          <div class="dictation-capsule-float ${state.dictationState === 'listening' || state.dictationState === 'thinking' ? 'visible' : ''}" id="liveCapsule">
            <canvas class="capsule-orb-mini" id="liveCapsuleOrb" width="64" height="64"></canvas>
            <span class="capsule-state-label" id="liveCapsuleLabel">
              ${state.dictationState === 'thinking' ? 'Transcribing…' : 'Listening…'}
            </span>
            <div class="wave-bars" id="liveWaveBars">
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
              <span class="wave-bar"></span>
            </div>
          </div>

          <div class="notepad-action-bar">
            <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-secondary)">
              <span>Press</span>
              <span class="mini-kbd">${state.shortcut.text}</span>
              ${modelNotReady ? `<span style="color:var(--accent)">· Model finishing (${Math.round(state.modelProgress)}%)</span>` : ''}
            </div>
            <div style="display:flex;align-items:center;gap:6px;">
              <button class="link-btn" id="simFailBtn" style="color:var(--ink-muted)" title="Test failure + skip fallback after 2 errors">Test error</button>
              <button class="btn btn-secondary btn-compact" id="simDictateBtn" ${state.dictationState === 'listening' || state.dictationState === 'thinking' ? 'disabled' : ''}>
                ${state.dictationState === 'listening' ? 'Listening…' : state.dictationState === 'thinking' ? 'Transcribing…' : 'Simulate Dictation'}
              </button>
            </div>
          </div>
        </div>

        ${state.dictationState === 'success' ? `
          <div class="inline-banner success">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" style="color:var(--green);flex-shrink:0;margin-top:1px"><path d="M3.5 8.5L6.5 11.5L12.5 4.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span><strong>It worked!</strong> Stet is ready to dictate in any app you use.</span>
          </div>
        ` : state.dictationState === 'error' ? `
          <div class="inline-banner error">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" style="color:var(--red);flex-shrink:0;margin-top:1px"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.4"/><path d="M8 5V8.6M8 10.9V11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>${state.lastFailureMsg}${state.failureCount >= 2 ? ' You can now skip for now and try later.' : ''}</span>
          </div>
        ` : ''}
      `;
    }

    function buildAppearanceStep() {
      const activeTheme = THEMES.find(t => t.id === state.selectedTheme) || THEMES[0];
      const tiles = THEMES.map(t => `
        <button class="theme-tile ${t.id === state.selectedTheme ? 'active' : ''}" data-pick-theme="${t.id}" title="${t.title}">
          <span class="theme-swatch-orb" style="background: radial-gradient(circle at 30% 28%, ${t.swatches[1]} 0%, ${t.swatches[0]} 48%, ${t.swatches[2]} 100%);"></span>
          <span class="theme-tile-name">${t.short}</span>
        </button>
      `).join('');

      return `
        <div class="step-heading">
          <div class="step-eyebrow">Step 5 of 5</div>
          <h2 class="step-title">Choose your dictation orb</h2>
          <p class="step-subtitle">Pick a watercolor palette for your floating indicator. You can change it anytime.</p>
        </div>

        <div class="appearance-stage">
          <div class="orb-showcase-card">
            <div class="orb-showcase-wash"></div>
            <div class="capsule-preview-pill ${state.orbPulseActive ? 'pulsing' : ''}" id="appearanceCapsule" title="Click to preview voice reaction">
              <canvas class="appearance-orb-canvas" id="appearanceOrbCanvas" width="128" height="128"></canvas>
            </div>
            <div class="showcase-meta">
              <span class="showcase-theme-name">${activeTheme.title}</span>
              <span style="color:var(--hairline-strong)">·</span>
              <button class="link-btn" id="pulseOrbBtn">${state.orbPulseActive ? 'Simulating voice…' : 'Preview voice pulse'}</button>
            </div>
          </div>

          <div class="theme-strip">${tiles}</div>
        </div>
      `;
    }

    function buildDoneStep() {
      const lang = LANGUAGES.find(l => l.code === state.primaryLang) || LANGUAGES[0];
      const theme = THEMES.find(t => t.id === state.selectedTheme) || THEMES[0];
      return `
        <div class="done-stage">
          <div class="hero-orb-wrap" style="margin-bottom:14px;">
            <div class="hero-orb-halo"></div>
            <canvas class="hero-orb-canvas" id="doneOrbCanvas" width="192" height="192"></canvas>
          </div>
          <h1 class="welcome-title" style="font-size:24px;">You’re all set</h1>
          <p class="welcome-sub">
            Stet now lives quietly in your menu bar. Press <strong>${state.shortcut.text}</strong> anywhere you can type.
          </p>
          <div class="done-summary">
            <span class="feature-pill">${lang.native}${state.secondaryLang ? ' + ' + (LANGUAGES.find(l => l.code === state.secondaryLang)?.native || '') : ''}</span>
            <span class="feature-pill">${getRoutedEngine().name}</span>
            <span class="feature-pill">${state.shortcut.text}</span>
            <span class="feature-pill">${theme.title}</span>
          </div>
        </div>
      `;
    }

    /* ========================================================================
       7. Step Interactions
       ======================================================================== */
    function bindStepEvents(id) {
      if (id === 'welcome') {
        const c = document.getElementById('welcomeOrbCanvas');
        currentStepOrb = mountOrb(c, state.selectedTheme);
        c?.addEventListener('click', () => {
          if (!currentStepOrb) return;
          currentStepOrb.targetEnergy = 0.95;
          setTimeout(() => { if (currentStepOrb) currentStepOrb.targetEnergy = 0; }, 900);
        });
      }

      if (id === 'language') {
        document.getElementById('primarySlot')?.addEventListener('click', () => {
          state.activeLangSlot = 'primary';
          renderStep(false);
        });

        document.getElementById('secondarySlot')?.addEventListener('click', () => {
          state.activeLangSlot = 'secondary';
          renderStep(false);
        });

        document.getElementById('removeSecondaryBtn')?.addEventListener('click', (e) => {
          e.stopPropagation();
          const prevEngine = getRoutedEngine().id;
          state.secondaryLang = null;
          state.activeLangSlot = 'primary';
          if (getRoutedEngine().id !== prevEngine) {
            resetDownloadForEngineChange();
          }
          renderStep(false);
          renderFooter();
          updateDownloadIndicators();
        });

        document.getElementById('swapLangBtn')?.addEventListener('click', () => {
          if (!state.secondaryLang) return;
          const oldP = state.primaryLang;
          state.primaryLang = state.secondaryLang;
          state.secondaryLang = oldP;
          renderStep(false);
        });

        document.querySelectorAll('[data-lang]').forEach(btn => {
          btn.addEventListener('click', () => {
            const code = btn.dataset.lang;
            const prevEngine = getRoutedEngine().id;

            if (state.activeLangSlot === 'primary') {
              if (code === state.secondaryLang) {
                // Swap if picking the language already in Secondary
                state.secondaryLang = state.primaryLang;
              }
              state.primaryLang = code;
            } else {
              if (code === state.primaryLang) {
                // Swap if picking the language already in Primary (when secondary exists), otherwise ignore
                if (state.secondaryLang) {
                  state.primaryLang = state.secondaryLang;
                  state.secondaryLang = code;
                }
              } else {
                state.secondaryLang = code;
              }
            }

            if (getRoutedEngine().id !== prevEngine) {
              resetDownloadForEngineChange();
            }
            renderStep(false);
            renderFooter();
            updateDownloadIndicators();
          });
        });
      }

      if (id === 'permissions') {
        document.getElementById('grantMicBtn')?.addEventListener('click', () => {
          state.micGranted = true;
          renderStep(false);
          renderChrome();
          renderFooter();
        });
        document.getElementById('grantInputBtn')?.addEventListener('click', () => {
          state.inputGranted = true;
          renderStep(false);
          renderChrome();
          renderFooter();
        });
      }

      if (id === 'shortcut') {
        document.querySelectorAll('[data-preset]').forEach(btn => {
          btn.addEventListener('click', () => {
            const p = SHORTCUT_PRESETS.find(x => x.id === btn.dataset.preset);
            if (p) {
              state.shortcut = p;
              state.recordingShortcut = false;
              state.shortcutDetected = false;
              renderStep(false);
            }
          });
        });

        document.getElementById('recordShortcutBtn')?.addEventListener('click', () => {
          state.recordingShortcut = !state.recordingShortcut;
          renderStep(false);
        });

        document.getElementById('simPressBtn')?.addEventListener('click', triggerShortcutPressVisual);
      }

      if (id === 'firstSuccess') {
        const input = document.getElementById('firstSuccessInput');
        if (input) {
          input.focus();
          input.addEventListener('input', e => { state.dictatedText = e.target.value; });
        }

        const capOrb = document.getElementById('liveCapsuleOrb');
        currentStepOrb = mountOrb(capOrb, state.selectedTheme);

        document.getElementById('simDictateBtn')?.addEventListener('click', runSimulatedDictation);
        document.getElementById('simFailBtn')?.addEventListener('click', () => {
          clearDictationTimers();
          state.failureCount += 1;
          state.dictationState = 'error';
          state.lastFailureMsg = state.failureCount === 1
            ? 'No speech detected. Check your microphone input and try again.'
            : 'Audio capture did not return text (attempt 2).';
          renderStep(false);
          renderFooter();
        });
      }

      if (id === 'appearance') {
        const c = document.getElementById('appearanceOrbCanvas');
        currentStepOrb = mountOrb(c, state.selectedTheme);

        const triggerPulse = () => {
          if (!currentStepOrb) return;
          state.orbPulseActive = true;
          document.getElementById('appearanceCapsule')?.classList.add('pulsing');
          const pulseBtn = document.getElementById('pulseOrbBtn');
          if (pulseBtn) pulseBtn.textContent = 'Simulating voice…';
          currentStepOrb.targetEnergy = 0.95;
          setTimeout(() => {
            state.orbPulseActive = false;
            document.getElementById('appearanceCapsule')?.classList.remove('pulsing');
            if (pulseBtn) pulseBtn.textContent = 'Preview voice pulse';
            if (currentStepOrb) currentStepOrb.targetEnergy = 0;
          }, 1500);
        };

        document.getElementById('appearanceCapsule')?.addEventListener('click', triggerPulse);
        document.getElementById('pulseOrbBtn')?.addEventListener('click', triggerPulse);

        document.querySelectorAll('[data-pick-theme]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.selectedTheme = btn.dataset.pickTheme;
            updateAmbientColors();
            document.querySelectorAll('[data-pick-theme]').forEach(b => {
              b.classList.toggle('active', b.dataset.pickTheme === state.selectedTheme);
            });
            const nameEl = document.querySelector('.showcase-theme-name');
            const t = THEMES.find(x => x.id === state.selectedTheme);
            if (nameEl && t) nameEl.textContent = t.title;
            if (currentStepOrb) {
              currentStepOrb.targetEnergy = 0.55;
              setTimeout(() => { if (currentStepOrb) currentStepOrb.targetEnergy = 0; }, 450);
            }
          });
        });
      }

      if (id === 'done') {
        const c = document.getElementById('doneOrbCanvas');
        currentStepOrb = mountOrb(c, state.selectedTheme);
      }
    }

    function triggerShortcutPressVisual() {
      const caps = document.querySelectorAll('#keycapsRow .keycap');
      caps.forEach(c => c.classList.add('pressed'));
      state.shortcutDetected = true;
      const status = document.getElementById('shortcutStatus');
      if (status) {
        status.classList.add('detected');
        status.innerHTML = `<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5L6.5 11.5L12.5 4.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Shortcut detected — ready to speak!</span>`;
      }
      setTimeout(() => caps.forEach(c => c.classList.remove('pressed')), 260);
    }

    function clearDictationTimers() {
      state.dictationTimers.forEach(t => clearTimeout(t));
      state.dictationTimers = [];
    }

    function runSimulatedDictation() {
      if (state.dictationState === 'listening' || state.dictationState === 'thinking') return;
      clearDictationTimers();

      // Ensure model finishes rapidly if user jumped ahead in prototype
      if (state.modelStatus !== 'ready') {
        state.modelStatus = 'ready';
        state.modelProgress = 100;
        updateDownloadIndicators();
      }

      state.dictationState = 'listening';
      const capsule = document.getElementById('liveCapsule');
      const label = document.getElementById('liveCapsuleLabel');
      const btn = document.getElementById('simDictateBtn');
      const bars = document.querySelectorAll('#liveWaveBars .wave-bar');

      if (capsule) capsule.classList.add('visible');
      if (label) label.textContent = 'Listening…';
      if (btn) { btn.disabled = true; btn.textContent = 'Listening…'; }
      if (currentStepOrb) currentStepOrb.targetEnergy = 0.92;

      // Animate mini wave bars
      const waveInterval = setInterval(() => {
        bars.forEach((b, i) => {
          const h = 4 + Math.random() * (i === 1 || i === 2 ? 10 : 7);
          b.style.height = `${h}px`;
        });
      }, 95);
      state.dictationTimers.push(waveInterval);

      // Phase 2: Thinking
      state.dictationTimers.push(setTimeout(() => {
        clearInterval(waveInterval);
        bars.forEach(b => { b.style.height = '4px'; });
        state.dictationState = 'thinking';
        if (label) label.textContent = 'Transcribing…';
        if (btn) btn.textContent = 'Transcribing…';
        if (currentStepOrb) currentStepOrb.targetEnergy = 0.35;
      }, 1500));

      // Phase 3: Type out result
      state.dictationTimers.push(setTimeout(() => {
        const lang = LANGUAGES.find(l => l.code === state.primaryLang) || LANGUAGES[0];
        const text = lang.sample;
        if (capsule) capsule.classList.remove('visible');
        if (currentStepOrb) currentStepOrb.targetEnergy = 0;

        const input = document.getElementById('firstSuccessInput');
        let idx = 0;
        const typeTimer = setInterval(() => {
          idx += 2;
          state.dictatedText = text.slice(0, idx);
          if (input) input.value = state.dictatedText;
          if (idx >= text.length) {
            clearInterval(typeTimer);
            state.dictationState = 'success';
            renderStep(false);
            renderChrome();
            renderFooter();
          }
        }, 24);
        state.dictationTimers.push(typeTimer);
      }, 2250));
    }

    /* ========================================================================
       8. Real Keyboard Listeners (Shortcut Recording, Live Key Press, Enter)
       ======================================================================== */
    function formatKeyCode(e) {
      if (e.code === 'Period') return { sym: '.', label: 'period' };
      if (e.code === 'Space') return { sym: '␣', label: 'space' };
      if (e.code.startsWith('Key')) {
        const ch = e.code.slice(3);
        return { sym: ch, label: ch };
      }
      if (e.code.startsWith('Digit')) {
        const d = e.code.slice(5);
        return { sym: d, label: d };
      }
      const k = e.key.length === 1 ? e.key.toUpperCase() : e.key;
      return { sym: k, label: k.toLowerCase() };
    }

    window.addEventListener('keydown', e => {
      const curId = STEPS[state.stepIndex].id;

      // Custom shortcut recorder
      if (curId === 'shortcut' && state.recordingShortcut) {
        if (['Meta', 'Control', 'Alt', 'Shift'].includes(e.key)) return;
        const mod = e.metaKey ? { sym: '⌘', label: 'command', mod: 'metaKey' }
                  : e.altKey ? { sym: '⌥', label: 'option', mod: 'altKey' }
                  : e.ctrlKey ? { sym: '⌃', label: 'control', mod: 'ctrlKey' }
                  : null;
        if (!mod) return;
        e.preventDefault();
        const k = formatKeyCode(e);
        state.shortcut = {
          id: 'custom',
          keys: [mod, { sym: k.sym, label: k.label, code: e.code }],
          text: `${mod.sym} ${k.sym === '␣' ? 'Space' : k.sym}`
        };
        state.recordingShortcut = false;
        state.shortcutDetected = true;
        renderStep(false);
        return;
      }

      // Detect matching shortcut on Shortcut or First Success step
      const modKey = state.shortcut.keys[0]?.mod;
      const mainCode = state.shortcut.keys[1]?.code;
      const isMatch = modKey && e[modKey] && e.code === mainCode;

      if (curId === 'shortcut') {
        state.pressedMods = { metaKey: e.metaKey, altKey: e.altKey, ctrlKey: e.ctrlKey, shiftKey: e.shiftKey };
        state.pressedCode = e.code;
        if (isMatch) {
          e.preventDefault();
          triggerShortcutPressVisual();
          return;
        }
        // Reflect live modifier press on keycaps
        const caps = document.querySelectorAll('#keycapsRow .keycap');
        state.shortcut.keys.forEach((k, i) => {
          const active = (k.mod && e[k.mod]) || (k.code && e.code === k.code);
          caps[i]?.classList.toggle('pressed', !!active);
        });
      }

      if (curId === 'firstSuccess' && isMatch) {
        e.preventDefault();
        runSimulatedDictation();
        return;
      }

      // Global Enter to continue (unless typing inside textarea)
      if (e.key === 'Enter' && !e.metaKey && !e.ctrlKey && document.activeElement?.tagName !== 'TEXTAREA') {
        if (canContinueCurrentStep()) {
          e.preventDefault();
          handlePrimaryAction();
        }
      }
    });

    window.addEventListener('keyup', () => {
      if (STEPS[state.stepIndex].id === 'shortcut') {
        document.querySelectorAll('#keycapsRow .keycap').forEach(c => c.classList.remove('pressed'));
      }
    });

    /* ========================================================================
       9. Prototype Toolbar Controls & Bootstrap
       ======================================================================== */
    function resetFlow() {
      clearDictationTimers();
      resetDownloadForEngineChange();
      state.stepIndex = 0;
      state.direction = 1;
      state.primaryLang = 'en';
      state.secondaryLang = null;
      state.activeLangSlot = 'primary';
      state.micGranted = false;
      state.inputGranted = false;
      state.shortcut = SHORTCUT_PRESETS[0];
      state.shortcutDetected = false;
      state.recordingShortcut = false;
      state.dictationState = 'idle';
      state.dictatedText = '';
      state.failureCount = 0;
      state.selectedTheme = 'watercolor';
      updateAmbientColors();
      renderAll();
    }

    function renderAll() {
      renderChrome();
      renderStep(true);
      renderFooter();
    }

    document.querySelectorAll('[data-set-layout]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.layout = btn.dataset.setLayout;
        document.documentElement.setAttribute('data-layout', state.layout);
        document.querySelectorAll('[data-set-layout]').forEach(b => b.classList.toggle('active', b === btn));
        updateDownloadIndicators();
      });
    });

    document.querySelectorAll('[data-set-theme]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.colorScheme = btn.dataset.setTheme;
        document.documentElement.setAttribute('data-theme', state.colorScheme);
        document.querySelectorAll('[data-set-theme]').forEach(b => b.classList.toggle('active', b === btn));
        updateAmbientColors();
      });
    });

    document.querySelectorAll('[data-set-dlmode]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.dlMode = btn.dataset.setDlmode;
        document.querySelectorAll('[data-set-dlmode]').forEach(b => b.classList.toggle('active', b === btn));
        renderStep(false);
        renderFooter();
        updateDownloadIndicators();
      });
    });

    document.getElementById('resetFlowBtn').addEventListener('click', resetFlow);

    // Boot
    sidebarOrb = mountOrb(document.getElementById('sidebarOrbCanvas'), state.selectedTheme);
    updateAmbientColors();
    renderAll();
  </script>
</body>
</html>
